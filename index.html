function dirText(deg){ return COMPASS[Math.round(deg/22.5)%16]; }
function pad(n){ return String(n).padStart(2,'0'); }
function jstDateParts(offsetDays=0){
  const now=new Date(Date.now()+offsetDays*86400000);
  const f=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  const [y,m,d]=f.format(now).split('-');
  return {y:+y,m:+m,d:+d,str:`${y}-${m}-${d}`};
}

function dateOf(iso){ return iso.slice(0,10); }
function weekdayOf(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); return WEEKDAY[new Date(y,m-1,d).getDay()]; }
function mdLabel(dateStr){ const [,m,d]=dateStr.split('-').map(Number); return `${m}/${d}`; }
function mdjp(dateStr){ const [,m,d]=dateStr.split('-').map(Number); return `${m}月${d}日`; }
function monthOf(dateStr){ return +dateStr.slice(5,7); }
function hm2dec(hm){ const [h,m]=hm.split(':').map(Number); return h+(m||0)/60; }
function dec2hm(x){ const h=Math.floor(x), m=Math.round((x-h)*60); return `${h}:${pad(m)}`; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function haversine(a,b,c,d){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(c-a),dLon=toR(d-b);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function nearestStation(lat,lon){
  let best=null,bd=Infinity;
  for(const s of TIDE_STATIONS){ const d=haversine(lat,lon,s[2],s[3]); if(d<bd){bd=d;best=s;} }
  return {pc:best[0],hc:best[1],lat:best[2],lon:best[3],name:best[4],dist:bd};
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

//=================== データ取得 ===================
async function getJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function fetchWeather(lat,lon){
  const base=`latitude=${lat}&longitude=${lon}&timezone=${TZ}&forecast_days=${FORECAST_DAYS}`;
  const wxUrl=`https://api.open-meteo.com/v1/forecast?${base}`
    +`&hourly=wind_speed_10m,wind_direction_10m,weather_code,pressure_msl,precipitation`
    +`&daily=weather_code,sunrise,sunset,precipitation_sum&wind_speed_unit=ms`;
  const marUrl=`https://marine-api.open-meteo.com/v1/marine?${base}&hourly=sea_surface_temperature,wave_height`;
  const [wx,mar]=await Promise.all([getJSON(wxUrl),getJSON(marUrl).catch(e=>{console.warn("marine fail",e);return null;})]);
  return {wx,mar};
}
async function fetchTide(st){
  const t=jstDateParts(0);
  const url=`https://tide736.net/api/get_tide.php?pc=${st.pc}&hc=${st.hc}&yr=${t.y}&mn=${t.m}&dy=${t.d}&rg=week`;
  return getJSON(url).catch(e=>{console.warn("tide fail",e);return null;});
}

//=================== 日別の環境データを組み立てる ===================
function idxAt(times,dateStr,h){
  for(let i=0;i<times.length;i++){ if(dateOf(times[i])===dateStr && hourOf(times[i])===h) return i; }
  return -1;
}
function dailyIdx(dayArr,dateStr){ for(let i=0;i<dayArr.length;i++){ if(dayArr[i].slice(0,10)===dateStr) return i; } return -1; }

// 潮の「動き」：極値（満・干）の間はsinで最大、満干ちょうどは緩む(0)
function movingAt(hour, extremes){
  if(extremes.length<2) return .55;
  let a=null,b=null;
  for(let i=0;i<extremes.length-1;i++){ if(hour>=extremes[i].t && hour<=extremes[i+1].t){a=extremes[i];b=extremes[i+1];break;} }
  if(!a){ if(hour<extremes[0].t){a=extremes[0];b=extremes[1];} else {a=extremes[extremes.length-2];b=extremes[extremes.length-1];} }
  const span=b.t-a.t; if(span<=0) return .55;
  const phase=clamp((hour-a.t)/span,0,1);
  return Math.sin(Math.PI*phase);
}

function buildEnv(data, dayOffset){
  const {wx,mar,tide}=data;
  const dateStr=jstDateParts(dayOffset).str;
  const month=monthOf(dateStr);

  // 日中(6〜18時)の海象・気象を集計
  const wt=wx.hourly.time;
  const wind=wx.hourly.wind_speed_10m, wdir=wx.hourly.wind_direction_10m;
  const wc=wx.hourly.weather_code, pres=wx.hourly.pressure_msl, prec=wx.hourly.precipitation;
  const mt=mar?mar.hourly.time:[], sst=mar?mar.hourly.sea_surface_temperature:[], wave=mar?mar.hourly.wave_height:[];

  let maxWind=0, maxWave=0, anyWave=false, thunder=false, sstSum=0, sstN=0, presMin=9999, precSum=0;
  for(let h=5;h<=19;h++){
    const i=idxAt(wt,dateStr,h); if(i<0) continue;
    if(wind[i]>maxWind) maxWind=wind[i];
    if(THUNDER_CODES.includes(wc[i])) thunder=true;
    if(pres[i]!=null && pres[i]<presMin) presMin=pres[i];
    if(prec[i]!=null) precSum+=prec[i];
    const mi=mt.length?idxAt(mt,dateStr,h):-1;
    if(mi>=0){
      if(wave[mi]!=null){ anyWave=true; if(wave[mi]>maxWave) maxWave=wave[mi]; }
      if(sst[mi]!=null){ sstSum+=sst[mi]; sstN++; }
    }
  }
  const sstAvg = sstN? sstSum/sstN : null;

  // 天気（日別）
  const di=dailyIdx(wx.daily.time,dateStr);
  const dayCode = di>=0? wx.daily.weather_code[di] : (idxAt(wt,dateStr,12)>=0? wc[idxAt(wt,dateStr,12)] : null);
  const sunrise = di>=0 && wx.daily.sunrise? hm2dec(wx.daily.sunrise[di].slice(11,16)) : 5;
  const sunset  = di>=0 && wx.daily.sunset ? hm2dec(wx.daily.sunset[di].slice(11,16))  : 19;
  const precDay = di>=0 && wx.daily.precipitation_sum!=null? wx.daily.precipitation_sum[di] : precSum;

  // 潮汐
  let tideDay=null;
  if(tide&&tide.tide&&tide.tide.chart&&tide.tide.chart[dateStr]){
    const c=tide.tide.chart[dateStr];
    const flood=(c.flood||[]).map(x=>({time:x.time,cm:+x.cm}));
    const ebb=(c.edd||[]).map(x=>({time:x.time,cm:+x.cm}));
    const extremes=[...flood.map(x=>({t:hm2dec(x.time.slice(0,5)),cm:x.cm})),
                    ...ebb.map(x=>({t:hm2dec(x.time.slice(0,5)),cm:x.cm}))].sort((p,q)=>p.t-q.t);
    // 24時間表示用：前日の最終・翌日最初の満干を境界として補い、深夜の潮の動きも正しく出す
    const chart=tide.tide.chart, keys=Object.keys(chart).sort(), di2=keys.indexOf(dateStr);
    const exList=(ds,off)=>{ const cc=chart[ds]; return cc?[...(cc.flood||[]),...(cc.edd||[])]
      .map(x=>({t:hm2dec(x.time.slice(0,5))+off,cm:+x.cm})).sort((a,b)=>a.t-b.t):[]; };
    if(di2>0){ const pv=exList(keys[di2-1],-24); if(pv.length) extremes.push(pv[pv.length-1]); }
    if(di2>=0&&di2<keys.length-1){ const nx=exList(keys[di2+1],24); if(nx.length) extremes.push(nx[0]); }
    extremes.sort((p,q)=>p.t-q.t);
    let hiCm=-1e9, loCm=1e9;
    flood.forEach(x=>hiCm=Math.max(hiCm,x.cm)); ebb.forEach(x=>loCm=Math.min(loCm,x.cm));
    const range = (hiCm>-1e9&&loCm<1e9)? hiCm-loCm : null;
    const moon = c.moon||{};
    const title = moon.title||'';
    let type = title.indexOf('大潮')>=0?'big' : title.indexOf('中潮')>=0?'mid'
             : (title.indexOf('小潮')>=0||title.indexOf('長潮')>=0||title.indexOf('若潮')>=0)?'small' : null;
    if(!type && range!=null){ type = range>=200?'big' : range>=90?'mid' : 'small'; } // 潮位差フォールバック
    tideDay={flood,ebb,extremes,range,type:type||'mid',title:title||'—',age:moon.age};
  }

  // 安全（出艇可否）判定
  let safety='GO';
  if(thunder || maxWind>=WIND_STOP || (anyWave&&maxWave>=WAVE_STOP)) safety='STOP';
  else if(maxWind>WIND_GO) safety='CAUTION';

  return {dateStr,month,sstAvg,maxWind,maxWave,anyWave,windDir:(idxAt(wt,dateStr,9)>=0?wdir[idxAt(wt,dateStr,9)]:null),
    dayCode,sunrise,sunset,precDay,presMin,thunder,tideDay,safety};
}

//=================== 魚種スコアリング ===================
function tempScore(t, sp){
  if(t==null) return .55;
  const [i0,i1]=sp.temp.ideal,[o0,o1]=sp.temp.ok;
  if(t>=i0&&t<=i1) return 1;
  if(t<=o0||t>=o1) return .08;
  if(t<i0) return .08+.92*(t-o0)/(i0-o0);
  return .08+.92*(o1-t)/(o1-i1);
}
function weatherScore(env, sp){
  let s=.72;
  if(env.presMin<1004) s+=.12; else if(env.presMin<1010) s+=.05;   // 低気圧接近は活性↑
  const p=env.precDay||0;
  if(sp.clarity==='clear'){ if(p>15) s-=.28; else if(p>5) s-=.14; }         // 澄み好み→濁りに弱い
  else if(sp.clarity==='sasa'){ if(p>=1&&p<=12) s+=.12; else if(p>25) s-=.12; } // ササ濁り歓迎、出水は×
  if(env.thunder) s-=.1;
  return clamp(s,.05,1);
}
// 時間帯の釣れやすさ：朝マズメ・夕マズメを鋭いピーク、日中はベース、夜は魚種次第
function timeFactorAt(h, sr, ss, sp){
  const night = sp.time.night ?? .25;
  const isDay = h >= sr-0.5 && h <= ss+0.5;
  const base = isDay ? sp.time.day : night;
  const w = 1.3;                                   // マズメの効く幅（時間）
  const gM = Math.exp(-(((h-sr)/w)**2));           // 朝マズメのピーク
  const gE = Math.exp(-(((h-ss)/w)**2));           // 夕マズメのピーク
  return Math.max(base, sp.time.morning*gM, sp.time.evening*gE);
}
function timeLabel(h, sr, ss){
  if(Math.abs(h-sr)<=1.5) return '朝マズメ';
  if(Math.abs(h-ss)<=1.5) return '夕マズメ';
  if(h<sr-0.5 || h>ss+0.5) return '夜';
  return '日中';
}
// 1時間刻みで釣れそう度(0〜1)を全時間帯ぶん計算し、ピークも拾う
function scoreSpecies(env, sp){
  const tS=tempScore(env.sstAvg, sp);
  const seaS=sp.season[env.month]??.4;
  const wS=weatherScore(env, sp);
  const type=env.tideDay?env.tideDay.type:'mid';
  const typeS=sp.tideType[type];
  const ex=env.tideDay?env.tideDay.extremes:[];
  const sr=env.sunrise, ss=env.sunset;

  const hourly=[]; let peak=null;
  for(let h=0; h<=23; h++){
    const move=movingAt(h, ex);
    const tideF = typeS*0.5 + move*0.5;            // 潮回りの良さ×その時間の潮の動き
    const timeF = timeFactorAt(h, sr, ss, sp);
    const total = tS*sp.weight.temp + seaS*sp.weight.season + tideF*sp.weight.tide
                + timeF*sp.weight.time + wS*sp.weight.weather;
    const cell = {h, score:clamp(total,0,1), move, tideF, timeF, label:timeLabel(h,sr,ss)};
    hourly.push(cell);
    if(!peak || cell.score>peak.score) peak=cell;
  }
  return {sp, score:peak.score, peak, hourly,
    f:{temp:tS,season:seaS,tide:peak.tideF,time:peak.timeF,weather:wS,type}, env};
}
function gradeCls(pct){ return pct>=75?'A':pct>=58?'B':pct>=42?'C':'D'; }

//=================== 釣行ログ連携（あなたの実績） ===================
// 釣行ログ(kayak-fishing-log)と同一オリジンなので localStorage を共有できる
const TRIPS_KEY = 'kayak-fishing-trips';
// 予報の魚種ID → 釣行ログで使われそうな魚種名・地方名（部分一致でヒット扱い）
const LOG_ALIASES = {
  aori:['アオリ'],
  buri:['ブリ','ワラサ','ハマチ','イナダ','ツバス','フクラギ','ガンド','コズクラ','メジロ','ヒラマサ','サワラ','サゴシ','青物'],
  hata:['キジハタ','アコウ','カサゴ','ガシラ','アラカブ','ソイ','アイナメ','根魚','ロック'],
  flat:['ヒラメ','マゴチ','コチ','座布団'],
  aji:['アジ','マアジ'],
  kisu:['キス','シロギス'],
  tachi:['タチウオ','太刀魚','タチ'],
  madai:['マダイ','真鯛','チャリコ'],
  suzuki:['スズキ','シーバス','セイゴ','フッコ','ハネ'],
  chinu:['クロダイ','黒鯛','チヌ','カイズ'],
  kamasu:['カマス'],
  mebaru:['メバル'],
  kawahagi:['カワハギ','ウマヅラ','ハゲ'],
  maika:['マイカ','ケンサキ','剣先','シロイカ','アカイカ']
};
let TRIPS = [];
function readTrips(){
  try{
    const raw=localStorage.getItem(TRIPS_KEY); if(!raw) return [];
    let d=JSON.parse(raw);
    if(d && !Array.isArray(d) && Array.isArray(d.value)) d=d.value;   // 念のため包装形式にも対応
    return Array.isArray(d)?d:[];
  }catch(e){ return []; }
}
function parseTemp(s){ const m=String(s==null?'':s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function tripCaught(trip, id){
  const al=LOG_ALIASES[id]||[];
  return (trip.catches||[]).some(c=>{
    const nm=((c&&c.species)||'').trim();
    if(!nm) return false;
    return al.some(a=> nm.includes(a) || a.includes(nm));
  });
}
function personalStats(sp, todaySst){
  let total=0, hits=0, bandTotal=0, bandHits=0;
  for(const t of TRIPS){
    if(!t || !t.date) continue;
    total++;
    const caught=tripCaught(t, sp.id);
    if(caught) hits++;
    if(todaySst!=null){
      const wt=parseTemp(t.waterTemp);
      if(wt!=null && Math.abs(wt-todaySst)<=2.5){ bandTotal++; if(caught) bandHits++; }
    }
  }
  return {total,hits,bandTotal,bandHits};
}
function grade(score){
  if(score>=.75) return {k:'A',mk:'◎',label:'超狙い目'};
  if(score>=.58) return {k:'B',mk:'○',label:'チャンスあり'};
  if(score>=.42) return {k:'C',mk:'△',label:'渋め'};
  return {k:'D',mk:'×',label:'厳しい'};
}

//=================== 根拠テキスト生成 ===================
function reasonText(r){
  const env=r.env, sp=r.sp, f=r.f;
  const parts=[];
  // 水温
  const t=env.sstAvg;
  if(t==null) parts.push('水温データなし');
  else if(f.temp>=.85) parts.push(`<span class="hi">水温${t.toFixed(1)}℃は適水温ど真ん中</span>`);
  else if(f.temp>=.5) parts.push(`水温${t.toFixed(1)}℃はまずまず`);
  else parts.push(`<span class="lo">水温${t.toFixed(1)}℃は適温から外れて渋い</span>`);
  // 季節
  if(f.season>=.9) parts.push('今が旬');
  else if(f.season<=.35) parts.push('<span class="lo">季節的にはオフ</span>');
  // 潮
  const type=env.tideDay?env.tideDay.title:'—';
  if(f.tide>=.7) parts.push(`${type}で${r.peak.label}に潮もよく動く`);
  else if(f.tide<=.4) parts.push(`<span class="lo">潮の動きが弱め（${type}）</span>`);
  else parts.push(`${type}`);
  // ピーク時間帯
  parts.push(`ピークは<b>${r.peak.label}・${r.peak.h}時ごろ（${Math.round(r.peak.score*100)}点）</b>`);
  return parts.join('、')+'。';
}
function factorChips(r){
  const f=r.f;
  const stars=v=> v>=.85?'◎':v>=.6?'○':v>=.4?'△':'×';
  const items=[
    ['水温',stars(f.temp)],['季節',stars(f.season)],['潮',stars(f.tide)],['時合',stars(f.time)],['天気',stars(f.weather)]
  ];
  return items.map(([k,v])=>`<span class="f"><b>${k}</b><span class="s">${v}</span></span>`).join('');
}

//=================== 描画 ===================
function renderEnv(env){
  const sst = env.sstAvg!=null? `${env.sstAvg.toFixed(1)}<small> ℃</small>` : '<small>取得不可</small>';
  const wxTxt = env.dayCode!=null? (WMO[env.dayCode]||'—') : '—';
  const windTxt = `${env.maxWind.toFixed(1)}<small> m/s</small>` + (env.windDir!=null?` <small>${dirText(env.windDir)}</small>`:'');
  const waveTxt = env.anyWave? `${env.maxWave.toFixed(1)}<small> m</small>` : '<small>—</small>';
  const tideTxt = env.tideDay? `${env.tideDay.title}` + (env.tideDay.range!=null?`<small> 差${Math.round(env.tideDay.range)}cm</small>`:'') : '<small>取得不可</small>';
  const sun = `${dec2hm(env.sunrise)}<small> / </small>${dec2hm(env.sunset)}`;
  const safeLabel={GO:'出られそう',CAUTION:'要確認',STOP:'出艇はやめて'};
  return `<div class="env">
    <h2>🌊 ${mdjp(env.dateStr)}（${weekdayOf(env.dateStr)}）の海況</h2>
    <div class="env-grid">

      <div class="env-cell"><span class="k">天気</span><span class="v">${wxTxt}</span></div>
      <div class="env-cell"><span class="k">潮回り</span><span class="v">${tideTxt}</span></div>
      <div class="env-cell"><span class="k">日の出／日の入</span><span class="v">${sun}</span></div>
      <div class="env-cell"><span class="k">最大風速</span><span class="v">${windTxt}</span></div>
      <div class="env-cell"><span class="k">最大波高</span><span class="v">${waveTxt}</span></div>
    </div>
    <div class="safety">
      <span class="pill ${env.safety}">${env.safety}</span>
      <span class="txt">出艇の安全目安：<b>${safeLabel[env.safety]}</b>${env.thunder?'（⚡雷の予報あり）':''}。詳しくは出艇判断チェックで確認を。</span>
    </div>

}
function renderHours(r){
  const cells=r.hourly.map(c=>{
    const pct=Math.round(c.score*100);
    const cls=gradeCls(pct);
    const isPeak=(c===r.peak)?' peak':'';
    return `<div class="hcell ${cls}${isPeak}"><span class="hh">${c.h}時</span><span class="hs">${pct}</span></div>`;
  }).join('');
  return `<p class="hours-cap">🕒 時間帯別の釣れそう度（0〜23時・100点満点・行ける時間で選ぼう →横スクロール）</p>
    <div class="hours-wrap"><div class="hours">${cells}</div></div>`;
}
function renderPersonal(r){
  if(!TRIPS.length) return '';
  const st=personalStats(r.sp, r.env.sstAvg);
  const rate = st.total? Math.round(st.hits/st.total*100) : 0;
  let s=`📓 あなたの実績：<b>${st.total}回中${st.hits}回</b>ヒット（${rate}%）`;
  if(st.bandTotal>=1 && r.env.sstAvg!=null){
    s+=`<br><span class="band">水温${Math.round(r.env.sstAvg)}℃前後の日：${st.bandTotal}回中${st.bandHits}回</span>`;
  }
  return `<div class="personal">${s}</div>`;
}
function renderFish(r){
  const g=grade(r.score);
  const pct=Math.round(clamp(r.score,0,1)*100);
  return `<div class="fish">
    <div class="fish-head">
      <div class="grade ${g.k}"><span class="mk">${g.mk}</span></div>
      <div class="fish-main">
        <div class="nm">${r.sp.emoji} ${escapeHtml(r.sp.name)}</div>
        <div class="lbl"><b>${g.label}</b>（ピーク ${pct}点）</div>
      </div>
    </div>
    <div class="bar ${g.k}"><i style="width:${pct}%"></i></div>
    <div class="fish-body">
      <div class="reason">${reasonText(r)}</div>
      ${renderHours(r)}
      <div class="factors">${factorChips(r)}</div>
      ${renderPersonal(r)}
      <div class="tips">💡 ${escapeHtml(r.sp.tips)}</div>

}
function renderTide(env){
  if(!env.tideDay) return '';
  const t=env.tideDay;
  const hi=t.flood.map(x=>`<span class="hi">満 ${x.time.slice(0,5)} (${x.cm}cm)</span>`).join('');
  const lo=t.ebb.map(x=>`<span class="lo">干 ${x.time.slice(0,5)} (${x.cm}cm)</span>`).join('');
  return `<div class="tide-row"><p class="k">潮汐（${escapeHtml(STATION?STATION.name:'')}）</p><div class="tide-line">${hi}${lo}</div></div>`;
}
function renderDay(off){
  if(!DATA) return;
  TRIPS = readTrips();
  const env=buildEnv(DATA, off);
  const results=SPECIES.map(sp=>scoreSpecies(env,sp)).sort((a,b)=>b.score-a.score);
  const banner = TRIPS.length ? '' :
    `<div class="logbanner">📓 <b>釣行ログ</b>に釣行を記録すると、ここに「あなたの実績（この魚が何回中何回釣れたか）」が出て、判定の答え合わせができます。<br><a href="../kayak-fishing-log/">釣行ログを開く →</a></div>`;
  const html = renderEnv(env) + banner + results.map(renderFish).join('') + renderTide(env);
  document.getElementById('content').innerHTML=html;
}

//=================== 状態・実行 ===================
let LOC=null, STATION=null, DATA=null, CURRENT_OFF=0;

function setTabLabels(){
  for(let off=0;off<3;off++){ document.getElementById('lab'+off).textContent=mdLabel(jstDateParts(off).str); }
}
function showDay(off){
  CURRENT_OFF=off;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',+b.dataset.off===off));
  renderDay(off);
}
async function load(lat,lon,locLabel){
  const content=document.getElementById('content');
  content.innerHTML='<div class="loading"><div class="spinner"></div>データを取得しています…</div>';
  LOC={lat,lon};
  STATION=nearestStation(lat,lon);
  const distTxt=STATION.dist>60?`<span class="locwarn">約${Math.round(STATION.dist)}km・遠い</span>`:`約${Math.round(STATION.dist)}km`;
  document.getElementById('locText').innerHTML=
    `📍 <b>${locLabel}</b>（${lat.toFixed(3)}, ${lon.toFixed(3)}）<br>潮汐観測点：<b>${escapeHtml(STATION.name)}</b>（${distTxt}）`;
  try{
    const wxp=fetchWeather(lat,lon); const tdp=fetchTide(STATION);
    const wx=await wxp; const tide=await tdp;
    DATA={wx:wx.wx,mar:wx.mar,tide};
    setTabLabels(); showDay(CURRENT_OFF);
  }catch(e){
    console.error(e);
    content.innerHTML=`<div class="error">⚠️ データを取得できませんでした。<br>通信環境を確認して「更新」を押してください。<br><small>${escapeHtml(e.message||e)}</small></div>`;
  }
}
function locateAndLoad(){
  document.getElementById('locText').textContent='現在地を取得しています…';
  if(!navigator.geolocation){ fallback('この端末では位置情報を取得できません'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ const {latitude,longitude}=pos.coords;
      try{ localStorage.setItem('kayak_loc',JSON.stringify({lat:latitude,lon:longitude})); }catch(e){}
      load(latitude,longitude,'現在地'); },
    err=>{ console.warn('geo err',err); fallbackStored('現在地を取得できませんでした'); },
    {enableHighAccuracy:true,timeout:10000,maximumAge:300000}
  );
}
function fallbackStored(msg){
  let saved=null;
  try{ const v=localStorage.getItem('kayak_loc'); if(v) saved=JSON.parse(v); }catch(e){}
  if(saved){ document.getElementById('locText').innerHTML=`<span class="locwarn">${msg}。前回の位置で表示します。</span>`; load(saved.lat,saved.lon,'前回の位置'); }
  else fallback(msg);
}
function fallback(msg){
  document.getElementById('locText').innerHTML=`<span class="locwarn">${msg}。既定地点（富山湾）で表示します。</span>`;
  load(DEFAULT_LOC.lat,DEFAULT_LOC.lon,DEFAULT_LOC.name);
}

//=================== 初期化 ===================
(function init(){
  setTabLabels();
  document.querySelectorAll('#tabs button').forEach(b=>{ b.addEventListener('click',()=>showDay(+b.dataset.off)); });
  document.getElementById('refreshBtn').addEventListener('click',()=>{ if(LOC) load(LOC.lat,LOC.lon,'現在地'); else locateAndLoad(); });
  document.getElementById('locBtn').addEventListener('click',locateAndLoad);
  locateAndLoad();
})();
</script>
</body>
